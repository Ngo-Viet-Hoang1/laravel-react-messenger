services:
  # ─── PHP-FPM ─────────────────────────────────────────────────────────────────
  app:
    image: ${APP_IMAGE:-ghcr.io/ngo-viet-hoang1/laravel-react-messenger}:${APP_TAG:-latest}
    container_name: ${APP_NAME:-laravel}_app
    restart: unless-stopped

    env_file: .env
    environment:
      APP_ENV: production
      DB_HOST: mysql
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REVERB_HOST: reverb

    volumes:
      - ./.env:/var/www/.env:ro
      - storage_data:/var/www/storage
      - bootstrap_cache:/var/www/bootstrap/cache

    networks:
      - laravel
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }

    # ─── Security hardening ───────────────────────────────────────────────────
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER

    healthcheck:
      test: ['CMD', '/healthcheck.sh']
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s

  # ─── Nginx ───────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: ${APP_NAME:-laravel}_nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./public:/var/www/public:ro
      - storage_data:/var/www/storage:ro
      - ./docker/nginx/prod/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/prod/default.conf:/etc/nginx/conf.d/default.conf:ro
      # SSL certs from Certbot
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - laravel
    depends_on:
      app:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SETUID
      - SETGID
      - CHOWN

  # ─── MySQL ───────────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: ${APP_NAME:-laravel}_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - laravel
    healthcheck:
      test:
        [
          'CMD',
          'mysqladmin',
          'ping',
          '-h',
          'localhost',
          '-uroot',
          '-p${DB_ROOT_PASSWORD}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─── Redis ───────────────────────────────────────────────────────────────────
  # Upstash alternative
  redis:
    image: redis:7-alpine
    container_name: ${APP_NAME:-laravel}_redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - laravel
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Horizon (Queue Worker) ───────────────────────────────────────────────────
  horizon:
    image: ${APP_IMAGE:-ghcr.io/ngo-viet-hoang1/laravel-react-messenger}:${APP_TAG:-latest}
    container_name: ${APP_NAME:-laravel}_horizon
    restart: unless-stopped
    command: php artisan horizon
    env_file: .env
    environment:
      APP_ENV: production
      DB_HOST: mysql
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - ./.env:/var/www/.env:ro
      - storage_data:/var/www/storage
      - bootstrap_cache:/var/www/bootstrap/cache
    networks:
      - laravel
    depends_on:
      redis: { condition: service_healthy }
      app: { condition: service_healthy }
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER

  # ─── Reverb (WebSocket) ──────────────────────────────────────────────────────
  reverb:
    image: ${APP_IMAGE:-ghcr.io/ngo-viet-hoang1/laravel-react-messenger}:${APP_TAG:-latest}
    container_name: ${APP_NAME:-laravel}_reverb
    restart: unless-stopped
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    env_file: .env
    environment:
      APP_ENV: production
      DB_HOST: mysql
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - '${REVERB_PORT:-8080}:8080'
    volumes:
      - ./.env:/var/www/.env:ro
      - storage_data:/var/www/storage
      - bootstrap_cache:/var/www/bootstrap/cache
    networks:
      - laravel
    depends_on:
      app: { condition: service_healthy }
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER

  # ─── Scheduler ───────────────────────────────────────────────────────────────
  scheduler:
    image: ${APP_IMAGE:-ghcr.io/ngo-viet-hoang1/laravel-react-messenger}:${APP_TAG:-latest}
    container_name: ${APP_NAME:-laravel}_scheduler
    restart: unless-stopped
    command: php artisan schedule:work
    env_file: .env
    environment:
      APP_ENV: production
      DB_HOST: mysql
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - ./.env:/var/www/.env:ro
      - storage_data:/var/www/storage
      - bootstrap_cache:/var/www/bootstrap/cache
    networks:
      - laravel
    depends_on:
      app: { condition: service_healthy }
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER

networks:
  laravel:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  storage_data:
  bootstrap_cache:
