
# ─── YAML Anchors ─────────────────────────────────────────────────────────────
# Reusable security hardening config applied to all app containers.
# Cap_drop ALL then re-add only what each process actually needs.
x-app-security: &app-security
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  cap_add:
    - SETUID
    - SETGID
    - CHOWN
    - DAC_OVERRIDE
    - FOWNER

x-app-base: &app-base
  image: ${APP_IMAGE:-ghcr.io/ngo-viet-hoang1/laravel-react-messenger}:${APP_TAG:-latest}
  restart: unless-stopped
  env_file: .env
  environment:
    APP_ENV: production
    DB_HOST: mysql
    DB_DATABASE: ${DB_DATABASE}
    DB_USERNAME: ${DB_USERNAME}
    DB_PASSWORD: ${DB_PASSWORD}
    REDIS_HOST: redis
    REDIS_PASSWORD: ${REDIS_PASSWORD}
  volumes:
    - ./.env:/var/www/.env:ro
    - storage_data:/var/www/storage
    - bootstrap_cache:/var/www/bootstrap/cache
  networks:
    - laravel
  <<: *app-security

services:
  # ─── PHP-FPM ─────────────────────────────────────────────────────────────────
  app:
    <<: *app-base
    container_name: ${APP_NAME:-laravel}_app
    environment:
      APP_ENV: production
      DB_HOST: mysql
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REVERB_HOST: reverb
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ['CMD', '/healthcheck.sh']
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s

  # ─── Nginx ───────────────────────────────────────────────────────────────────
  # Uses a custom image built from the nginx-production stage in Dockerfile.
  # public/build assets are baked into the image at build time → no bind mount needed.
  # Only stateful data (storage, SSL certs) is mounted from host.
  nginx:
    image: ${NGINX_IMAGE:-ghcr.io/ngo-viet-hoang1/laravel-react-messenger-nginx}:${NGINX_TAG:-latest}
    container_name: ${APP_NAME:-laravel}_nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      # User uploads (stateful — must persist across deploys)
      - storage_data:/var/www/storage:ro
      # SSL certificates from host Certbot (read-only — Certbot writes, Nginx reads)
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - laravel
    depends_on:
      app:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SETUID
      - SETGID
      - CHOWN

  # ─── MySQL ───────────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: ${APP_NAME:-laravel}_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - laravel
    healthcheck:
      test:
        [
          'CMD',
          'mysqladmin',
          'ping',
          '-h',
          'localhost',
          '-uroot',
          '-p${DB_ROOT_PASSWORD}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ${APP_NAME:-laravel}_redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - laravel
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Horizon (Queue Worker) ──────────────────────────────────────────────────
  horizon:
    <<: *app-base
    container_name: ${APP_NAME:-laravel}_horizon
    command: php artisan horizon
    depends_on:
      redis: { condition: service_healthy }
      app: { condition: service_healthy }

  # ─── Reverb (WebSocket) ──────────────────────────────────────────────────────
  # Port 8080 is intentionally NOT exposed to the host.
  # WebSocket traffic is proxied through Nginx (/app/ → reverb:8080 internally).
  # Exposing 8080 externally is a security risk and unnecessary.
  reverb:
    <<: *app-base
    container_name: ${APP_NAME:-laravel}_reverb
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    depends_on:
      app: { condition: service_healthy }

  # ─── Scheduler ───────────────────────────────────────────────────────────────
  scheduler:
    <<: *app-base
    container_name: ${APP_NAME:-laravel}_scheduler
    command: php artisan schedule:work
    depends_on:
      app: { condition: service_healthy }

networks:
  laravel:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  storage_data:
  bootstrap_cache:
