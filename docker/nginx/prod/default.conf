server {
    listen 80;
    server_name twiliver.dev www.twiliver.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name twiliver.dev www.twiliver.dev;
    root /var/www/public;
    index index.php;
    charset utf-8;
    client_max_body_size 40M;

    ssl_certificate     /etc/letsencrypt/live/twiliver.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/twiliver.dev/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:aNULL:!MD5;

    limit_conn perip 20;

    location /app/ {
        proxy_pass         http://reverb:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location /apps/ {
        proxy_pass       http://reverb:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ ^/(login|register|password|forgot-password) {
        limit_req zone=auth burst=5 nodelay;
        limit_req_status 429;

        try_files $uri $uri/ /index.php?$query_string;

        location ~ \.php$ {
            fastcgi_pass   app:9000;
            fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include        fastcgi_params;
        }
    }

    # ─── API routes ───────────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api burst=30 nodelay;
        limit_req_status 429;

        try_files $uri $uri/ /index.php?$query_string;

        location ~ \.php$ {
            fastcgi_pass   app:9000;
            fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include        fastcgi_params;
        }
    }

    # ─── User-uploaded storage files ──────────────────────────────────────────
    location ^~ /storage/ {
        alias /var/www/storage/app/public/;
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
        access_log off;
    }

    # ─── Static assets: long cache, serve directly ───────────────────────────
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|webp|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
        access_log off;
    }

    # ─── General routes ───────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass             app:9000;
        fastcgi_param            SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include                  fastcgi_params;
        fastcgi_read_timeout     60;
        fastcgi_hide_header      X-Powered-By;
        # Security headers
        add_header X-Frame-Options        "SAMEORIGIN"    always;
        add_header X-Content-Type-Options "nosniff"       always;
        add_header X-XSS-Protection       "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location ~ /\.(?!well-known).* { deny all; }
    error_page 404 /index.php;
}
